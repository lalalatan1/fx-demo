spring:
  datasource:
    url: jdbc:h2:mem:fxdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  task:
    scheduling:
      pool:
        size: 2

logging:
  level:
    root: INFO
    org.springframework.web.client: DEBUG

fx:
  oanda:
    base-url: https://fxds-public-exchange-rates-api.oanda.com
    base-currencies: EUR,USD,JPY,GBP
    quote: USD
    start-date: 2025-03-26
    end-date: 2025-03-27
